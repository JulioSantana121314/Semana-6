<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="logodiv">
      <img src="./img/logo.svg" class="logo" alt="logo" width="250px">

    </div>
    <nav>
      <ul class="nav-lista">
        <li><a class="link" href="#">Iniciar Sesión</a></li>
        <li><a class="link" href="#">Crear Cuenta</a></li>
        <li><button type="button" class="botón-reg">Registrar Restaurant</button></li>
      </ul>

    </nav>
  </header>
  <main>
    <section class="form-y-png">
      <div class="encuentra-y-pide">
          <h2 class="h2form">Encuentra y Pide comida de tu restaurante favorito</h2>
          <div class="searchform">
            <form>
              <div class="searchformitem">
                <label for="form-restaurant">RESTAURANT</label><br>
                <input class="forminput" id="form-restaurant" type="text" placeholder="Tacos México">
              </div>
              <div class="searchformitem">
                <label for="form-platillo">PLATILLO</label><br>
                <input class="forminput" id="form-platillo" type="text" placeholder="Pizza, Ensalada, Hamburguesa">
              </div>
              <button class="formbutton" type="button">Buscar</button>
            </form>
          </div>
      </div>
      <div class="repartidordiv">
        <img class="fotorepartidor" src="./img/dibujo_repartidor.svg" alt="repartidor">
      </div>
    </section>
    <section class="cómo-funciona">
      <div class="comoheader">
        <h2 class="h2como">¿Cómo funciona?</h2>
        <h3>tan fácil como 1, 2 y 3</h3>
      </div>
      <div class="pasos">
        <ul class="listapasos">
          <li>
            <img  class="paso" src="./img/paso_1.png" alt="paso1">
          </li>
          <li>
            <img  class="paso" src="./img/paso_2.png" alt="paso2">
          </li>
          <li>
            <img  class="paso" src="./img/paso_3.png" alt="paso3">
          </li>
        </ul>
      </div>
    </section>
  </main>
</body>
</html>
